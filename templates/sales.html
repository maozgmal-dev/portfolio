<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="/static/style.css"></head><body><nav class="nav"><a href="/">الرئيسية</a><a href="/inventory">المخزون</a><a href="/repairs">الصيانة</a><a href="/logout">خروج</a></nav><div class="wrap"><h1>🧾 المبيعات</h1><div class="card"><form method="post"><input name="customer" placeholder="اسم العميل"><table><tr><th>الصنف</th><th>السعر</th><th>المتاح</th><th>الكمية</th></tr>{% for r in rows %}<tr><td>{{r.name}}<input type="hidden" name="item_id" value="{{r.id}}"></td><td>{{r.sell_price}}</td><td>{{r.qty}}</td><td><input name="qty" type="number" min="0" max="{{r.qty}}" value="0"></td></tr>{% endfor %}</table><br><button>إنشاء فاتورة A4 وخصم المخزون</button></form></div><div class="card"><h2>آخر الفواتير</h2><table><tr><th>الفاتورة</th><th>العميل</th><th>الإجمالي</th><th></th></tr>{% for s in recent %}<tr><td>{{s.invoice}}</td><td>{{s.customer}}</td><td>{{s.total}}</td><td><a class="btn" href="/invoice/{{s.id}}">عرض</a></td></tr>{% endfor %}</table></div></div></body></html>
