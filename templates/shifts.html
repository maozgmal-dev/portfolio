<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="/static/style.css"></head><body><nav class="nav"><a href="/">الرئيسية</a><a href="/logout">خروج</a></nav><div class="wrap"><h1>💰 الحسابات والشفتات</h1><div class="card"><form method="post" class="form"><input name="shift_date" type="date" required><input name="opening" type="number" step="0.01" placeholder="بداية الشفت"><input name="closing" type="number" step="0.01" placeholder="نهاية الشفت"><textarea name="notes" placeholder="ملاحظات"></textarea><button>حفظ الشفت</button></form></div><div class="card"><table><tr><th>التاريخ</th><th>البداية</th><th>النهاية</th><th>ملاحظات</th></tr>{% for r in rows %}<tr><td>{{r.shift_date}}</td><td>{{r.opening}}</td><td>{{r.closing}}</td><td>{{r.notes}}</td></tr>{% endfor %}</table></div></div></body></html>
