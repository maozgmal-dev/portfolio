<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="/static/style.css"></head><body><nav class="nav"><a href="/">الرئيسية</a><a href="/repairs">الصيانة</a><a href="/sales">المبيعات</a><a href="/logout">خروج</a></nav><div class="wrap"><h1>📦 المشتريات والمخزون</h1><div class="card"><form method="post" class="form"><input name="name" placeholder="اسم الصنف" required><select name="category"><option>قطع الغيار</option><option>الجرابات</option><option>الشواحن</option><option>السماعات البلوتوث</option><option>أخرى</option></select><input name="qty" type="number" placeholder="الكمية"><input name="buy_price" type="number" step="0.01" placeholder="سعر الشراء (مخفي عن المستخدم العادي)"><input name="sell_price" type="number" step="0.01" placeholder="سعر البيع"><input name="min_qty" type="number" value="3" placeholder="حد التنبيه"><button>إضافة الصنف</button></form></div><div class="card"><table><tr><th>الصنف</th><th>التصنيف</th><th>الكمية</th><th>سعر البيع</th>{% if developer %}<th>سعر الشراء</th><th></th>{% endif %}</tr>{% for r in rows %}<tr class="{% if r.qty<r.min_qty %}low{% endif %}"><td>{{r.name}}</td><td>{{r.category}}</td><td>{{r.qty}} {% if r.qty<r.min_qty %}⚠️{% endif %}</td><td>{{r.sell_price}}</td>{% if developer %}<td>{{r.buy_price}}</td><td><form method="post" action="/inventory/{{r.id}}/delete"><button class="danger">حذف</button></form></td>{% endif %}</tr>{% endfor %}</table></div></div></body></html>
