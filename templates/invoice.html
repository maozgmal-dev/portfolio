<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="/static/style.css"><title>{{sale.invoice}}</title></head><body><div class="wrap"><div class="card"><h1>📱 سمارت أوبشن هاتف</h1><h2>فاتورة مبيعات</h2><p>رقم الفاتورة: {{sale.invoice}}</p><p>العميل: {{sale.customer}}</p><table><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>{% for i in items %}<tr><td>{{i.name}}</td><td>{{i.qty}}</td><td>{{i.price}}</td><td>{{i.qty*i.price}}</td></tr>{% endfor %}</table><h2>الإجمالي: {{sale.total}} ج.م</h2><button class="no-print" onclick="window.print()">🖨️ طباعة A4</button></div></div></body></html>
